name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run playback indicator regression tests
        run: swift test --filter SpectrumBarsTests

      - name: Run Codex activity regression tests
        run: swift test --filter CodexProtocolTests

      - name: Run full test suite
        run: swift test

      - name: Build release binary
        run: swift build -c release
